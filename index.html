<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webseite nicht verfügbar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .red-x {
      width: 120px;
      height: 120px;
      margin-bottom: 1.5rem;
      stroke: #ef4444;
      stroke-width: 8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.4));
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="red-x" viewBox="0 0 100 100">
      <line x1="20" y1="20" x2="80" y2="80" />
      <line x1="80" y1="20" x2="20" y2="80" />
    </svg>
    <h1>Diese Webseite ist nicht mehr verfügbar</h1>
  </div>
</body>
</html>
