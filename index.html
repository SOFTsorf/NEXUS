<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webseite nicht verfügbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Scrollen deaktiviert */
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: table;
        }

        .wrapper {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            padding: 5vw;
        }

        .container {
            display: inline-block;
            max-width: 90vw;
            width: 100%;
        }

        .icon-container {
            margin: 0 auto 3vh auto;
            /* Flexibel angepasst & kleiner gemacht */
            width: clamp(48px, 12vw, 75px);
            height: clamp(48px, 12vw, 75px);
        }

        .svg-icon {
            width: 100%;
            height: 100%;
            display: block;
        }

        h1 {
            color: #1a1a1a;
            /* Passt sich der Bildschirmgröße an */
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 600;
            line-height: 1.3;
        }

        /* Standard / leicht altmodischer Banner-Stil */
        .floating-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffe0;
            border: 2px solid #666;
            padding: 8px 12px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #000;
        }

        .banner-btn {
            background-color: #e0e0e0;
            color: #000;
            border: 1px solid #767676;
            padding: 4px 10px;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
        }

        .banner-btn:hover {
            background-color: #d0d0d0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
            color: #333;
            line-height: 1;
        }

        .close-btn:hover {
            color: #ff0000;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <div class="icon-container">
                <svg class="svg-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="44" stroke="#e53e3e" stroke-width="7" fill="none"/>
                    <path d="M38 38 L62 62 M62 38 L38 62" stroke="#e53e3e" stroke-width="7" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Diese Webseite ist nicht mehr verfügbar</h1>
        </div>
    </div>

    <div id="floating-banner" class="floating-banner">
        <span>Schau dir unser neustes Projekt an.</span>
        <a href="https://cliqposts.vercel.app/" target="_blank" rel="noopener noreferrer" class="banner-btn">Hier klicken</a>
        <button class="close-btn" onclick="document.getElementById('floating-banner').style.display='none';">&times;</button>
    </div>

</body>
</html>
