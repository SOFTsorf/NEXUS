<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webseite nicht verfügbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Scrollen komplett deaktiviert */
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: table;
        }

        .wrapper {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: inline-block;
            max-width: 500px;
            width: 100%;
        }

        .icon-container {
            margin: 0 auto 30px auto;
            width: 100px;
            height: 100px;
        }

        .svg-icon {
            width: 100%;
            height: 100%;
        }

        h1 {
            color: #1a1a1a;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <div class="icon-container">
                <svg class="svg-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Roter Kreis -->
                    <circle cx="50" cy="50" r="45" stroke="#e53e3e" stroke-width="6" fill="none"/>
                    <!-- Rotes X -->
                    <path d="M35 35 L65 65 M65 35 L35 65" stroke="#e53e3e" stroke-width="6" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>Diese Webseite ist nicht mehr verfügbar</h1>
        </div>
    </div>

</body>
</html>
