<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webseite nicht verfügbar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Scrollen komplett deaktivieren */
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            text-align: center;
            padding: 20px;
        }

        .text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e2e8f0;
            position: relative;
            z-index: 1;
        }

        /* Rotes X direkt über dem Text */
        .cross-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .cross-overlay svg {
            width: 100%;
            height: 100%;
            stroke: #ef4444;
            stroke-width: 6;
            stroke-linecap: round;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text">Diese Webseite ist nicht mehr verfügbar</h1>
        <div class="cross-overlay">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none">
                <line x1="5" y1="5" x2="95" y2="95" />
                <line x1="95" y1="5" x2="5" y2="95" />
            </svg>
        </div>
    </div>

</body>
</html>
